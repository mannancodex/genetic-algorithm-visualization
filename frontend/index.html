<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudSched · NSGA-II Research Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#080d18;--panel:#0e1626;--panel2:#111c30;--line:#22314a;--text:#e9eef8;--muted:#8190aa;
 --accent:#69a3ff;--accent2:#54d6ae;--warn:#f4bf5f;--danger:#ff7187;--violet:#ad8cff;
 --shadow:0 18px 50px #00000030;
}
:root[data-theme=light]{--bg:#f4f7fb;--panel:#fff;--panel2:#f7f9fc;--line:#dce4ef;--text:#162136;--muted:#64728b;--shadow:0 14px 35px #14213a12}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
 radial-gradient(900px 500px at 75% -10%,#2c5bb52b,transparent),
 radial-gradient(700px 450px at -10% 30%,#5c3db31a,transparent),var(--bg);
 color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 70%)}
button,input,select{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:11px 22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px)}
.brand{font-weight:700;letter-spacing:-.02em;white-space:nowrap}.brand b{color:var(--accent)}
.nav{display:flex;gap:3px;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:8px;white-space:nowrap}.nav button:hover,.nav button.active{color:var(--text);background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.spacer{flex:1}
.shell{max-width:1320px;margin:auto;padding:26px 22px 70px;position:relative}
.eyebrow{font:500 11px 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
h1{font-size:32px;line-height:1.08;letter-spacing:-.035em;margin:0 0 10px}h2{font-size:17px;margin:0 0 9px}h3{font-size:13px;margin:0 0 5px}
.sub{color:var(--muted);max-width:760px}.muted{color:var(--muted)}.mono{font-family:'JetBrains Mono',monospace}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:9px}.btn:hover{border-color:#416083}.btn.primary{border-color:transparent;background:var(--accent);color:#06101e;font-weight:650}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}
.surface{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel2) 65%,transparent));border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:stretch;margin-bottom:22px}.hero .surface{display:flex;flex-direction:column;justify-content:center;min-height:330px}
.signal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 15px var(--accent2)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:25px}.flow-node{padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);min-width:115px}.flow-node b{display:block;font-size:13px}.flow-node span{font-size:11px;color:var(--muted)}.flow-arrow{height:1px;flex:1;min-width:24px;background:linear-gradient(90deg,var(--accent),transparent);position:relative}.flow-arrow:after{content:"";position:absolute;right:0;top:-3px;border:3px solid transparent;border-right:0;border-left-color:var(--accent)}
.steps{display:flex;gap:8px;margin:0 0 22px;overflow:auto}.step{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted);white-space:nowrap}.step b{font-size:11px}.step.active{border-color:#456a9d;color:var(--text);background:#16243a}.step.done{color:var(--accent2)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.kpi{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.kpi strong{font-size:19px;display:block}.kpi span{font-size:11px;color:var(--muted)}
.label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;outline:none}input:focus,select:focus{border-color:#527aa9}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar .grow{flex:1}
details{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}.scroll{max-height:410px;overflow:auto}
.tag{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:99px;font-size:11px;color:var(--muted);margin:2px}.tag.active{color:var(--text);border-color:var(--accent);background:#69a3ff14}.tag.ok{color:var(--accent2);border-color:#54d6ae55}.tag.bad{color:var(--danger);border-color:#ff718755}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:24px 0 11px}.section-head p{margin:0;color:var(--muted);font-size:12px}
svg{display:block;max-width:100%}.chart-wrap{overflow:auto}.axis{stroke:var(--line);stroke-width:1}.gridline{stroke:var(--line);stroke-width:1;opacity:.7}.chart-label{fill:var(--muted);font-size:11px}.chart-title{fill:var(--text);font-size:12px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.pop-grid{display:flex;gap:5px;flex-wrap:wrap;max-height:210px;overflow:hidden}.gene{width:14px;height:22px;border-radius:3px;background:#27344a;display:inline-block;position:relative}.gene.hot{background:var(--accent)}.gene.muted{background:#344157}.gene:after{content:attr(data-v);position:absolute;inset:0;display:grid;place-items:center;font-size:7px;color:#dce7f7}
.chromosome{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:6px}.chromosome .genes{display:flex;gap:2px;overflow:hidden}.chromosome .state{margin-left:auto;font-size:10px;color:var(--muted)}
.phase{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.phase div{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:11px;color:var(--muted);transition:.25s}.phase div.live{color:var(--text);border-color:var(--accent);box-shadow:0 0 0 1px #69a3ff22}.phase div.done{color:var(--accent2);border-color:#54d6ae55}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:11px}
.vmrow{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .45s}
.callout{border-left:3px solid var(--accent);padding:8px 11px;background:#69a3ff0b;color:var(--muted);font-size:12px}
.compare-value{font-family:'JetBrains Mono';font-size:12px}.good{color:var(--accent2)}.bad{color:var(--danger)}
.result-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.big-result{padding:20px;border-radius:15px;border:1px solid var(--line);background:linear-gradient(145deg,#13233b,#0d1727)}.big-result h2{font-size:23px}.delta{display:flex;gap:18px;flex-wrap:wrap}.delta strong{display:block;font-size:21px}.delta span{font-size:11px;color:var(--muted)}
.gantt-tip{font-size:11px;color:var(--muted)}
.alert{padding:10px 12px;border:1px solid #ff718744;background:#ff71870d;color:var(--danger);border-radius:9px;font-size:12px}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-28}}.moving{stroke-dasharray:9 9;animation:dash 1s linear infinite}.pulse{animation:pulse 1.5s ease-in-out infinite}
@media(max-width:980px){.hero,.result-hero{grid-template-columns:1fr}.cols4,.kpis{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.shell{padding:18px 13px 50px}.top{padding:9px 12px}.brand{width:100%}.cols2,.cols3,.cols4,.kpis{grid-template-columns:1fr}.phase{grid-template-columns:1fr 1fr}h1{font-size:27px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const api=async(u,o)=>{const r=await fetch('/api'+u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const OBJ={makespan:['Makespan','s'],cost:['Cost','$'],energy:['Energy','Wh'],utilization:['Utilization','%'],imbalance:['Load imbalance','CV'],tardiness:['Weighted tardiness','s']};
const fmt=(k,v)=>v==null?'–':k==='utilization'?(v*100).toFixed(1)+'%':Math.abs(v)<1?v.toFixed(4):v.toFixed(2);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const dl=(name,txt)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const steps=[['workload','Workload'],['resources','Cloud Resources'],['optimize','Optimization'],['results','Results'],['pareto','Pareto Explorer']];
const phases=['selection','crossover','mutation','repair','offspring_evaluation','non_dominated_sort','crowding_distance','population_combination','next_generation','pareto_front'];
const phaseLabel={selection:'Parent selection',crossover:'Crossover',mutation:'Mutation',repair:'Constraint repair',offspring_evaluation:'Offspring evaluation',non_dominated_sort:'Non-dominated sorting',crowding_distance:'Crowding distance',population_combination:'Population + offspring',next_generation:'Next generation',pareto_front:'Pareto front'};

function Header({page,setPage,theme,setTheme}){return <header className="top"><div className="brand"><b>◆</b> CloudSched</div><nav className="nav">{steps.map(([k,l])=><button key={k} className={page===k?'active':''} onClick={()=>setPage(k)}>{l}</button>)}</nav><div className="spacer"/><button className="btn ghost" onClick={()=>setTheme(theme==='dark'?'light':'dark')}>{theme==='dark'?'Light':'Dark'}</button></header>}

function StepBar({page,setPage,completed}){return <div className="steps">{steps.map(([k,l],i)=><button key={k} className={'step '+(page===k?'active ':'')+(completed[k]?'done':'')} onClick={()=>setPage(k)}><b>0{i+1}</b>{l}</button>)}</div>}

function Intro({go,P}){return <><div className="hero"><div className="surface"><div className="eyebrow">Research-grade scheduling workspace</div><h1>See the optimizer think.</h1><p className="sub">A transparent NSGA-II workflow for dependent cloud tasks. Configure the workload, watch the real population evolve, then inspect the schedules and trade-offs it produced.</p><div className="flow">
<div className="flow-node"><b>Tasks</b><span>{P.tasks.length} DAG nodes</span></div><div className="flow-arrow"/><div className="flow-node"><b>NSGA-II</b><span>rank · crowd · evolve</span></div><div className="flow-arrow"/><div className="flow-node"><b>Cloud pool</b><span>{P.vms.length} modelled VMs</span></div><div className="flow-arrow"/><div className="flow-node"><b>Pareto schedules</b><span>executable plans</span></div></div><div style={{marginTop:22}}><button className="btn primary" onClick={()=>go('workload')}>Start with workload →</button></div></div>
<div className="surface"><div className="eyebrow">What is preserved</div><h2>The backend remains the source of truth.</h2><div className="callout">The visual layer reads real generation snapshots from the existing NSGA-II engine. No random chart data or simulated progress is introduced.</div><div style={{marginTop:18}} className="grid">
{[['Encoding','VM assignment + random-key priority'],['Evolution','Tournament → crossover → mutation → repair'],['Selection','Non-dominated sorting + crowding distance'],['Baseline','DAG-aware Min-Min comparison']].map(x=><div key={x[0]} className="pill"><span className="dot"/><span><b>{x[0]}</b> · {x[1]}</span></div>)}</div></div></div>
<div className="section-head"><div><h2>Workflow</h2><p>Progressive disclosure keeps the main surface focused.</p></div></div>
<div className="grid cols3">{[['01','Workload','Tasks, dependencies, deadlines and demands.'],['02','Cloud resources','Heterogeneous VM capacities, price and power.'],['03','Optimization','Objectives and NSGA-II controls.'],['04','Live evolution','Population, operators and Pareto convergence.'],['05','Results','Gantt schedule, utilization and baseline deltas.'],['06','Pareto explorer','Select the compromise you actually want.']].map(x=><div className="surface" key={x[0]}><div className="eyebrow">{x[0]}</div><h3>{x[1]}</h3><p className="muted" style={{margin:0,fontSize:12}}>{x[2]}</p></div>)}</div></>}

function Workload({P,setP}){const [n,setN]=useState(P.tasks.length||30);const [showAdvanced,setShowAdvanced]=useState(false);
 const set=(i,k,v)=>setP(p=>({...p,tasks:p.tasks.map((t,x)=>x===i?{...t,[k]:v}:t)}));
 const upload=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.tasks)throw 0;setP(p=>({...p,tasks:j.tasks,vms:j.vms||p.vms}));setN(j.tasks.length)}catch{alert('Expected JSON with tasks and optional vms arrays.')}})};
 return <><div className="section-head"><div><div className="eyebrow">Step 01</div><h1>Workload</h1><p>Define the DAG the optimizer must schedule.</p></div><div className="toolbar"><input style={{width:80}} type="number" min="1" value={n} onChange={e=>setN(+e.target.value)}/><button className="btn" onClick={async()=>{const d=await api(`/sample?n=${n}&m=${P.vms.length}&seed=${P.params.seed}`);setP(p=>({...p,tasks:d.tasks,vms:d.vms}))}}>Generate seeded</button><label className="btn">Upload JSON<input hidden type="file" accept=".json" onChange={upload}/></label></div></div>
<div className="surface"><div className="toolbar"><span className="pill"><b>{P.tasks.length}</b> tasks</span><span className="pill"><b>{P.tasks.reduce((s,t)=>s+t.deps.length,0)}</b> dependency edges</span><span className="pill"><b>{P.tasks.filter(t=>t.deadline!=null).length}</b> deadlines</span><span className="grow"/><button className="btn" onClick={()=>setP(p=>({...p,tasks:[...p.tasks,{id:'T'+p.tasks.length,length:5000,cpu:1,mem:1,storage:5,bw:50,arrival:0,deadline:null,priority:1,deps:[]}]}))}>+ Task</button></div>
<div className="scroll" style={{marginTop:12}}><table><thead><tr><th>ID</th><th>Length MI</th><th>CPU</th><th>RAM</th><th>Disk</th><th>BW</th><th>Arrival</th><th>Deadline</th><th>Priority</th><th>Deps</th><th/></tr></thead><tbody>{P.tasks.map((t,i)=><tr key={i}><td><input value={t.id} onChange={e=>set(i,'id',e.target.value)}/></td>{['length','cpu','mem','storage','bw','arrival','deadline','priority'].map(k=><td key={k}><input type="number" value={t[k]??''} onChange={e=>set(i,k,e.target.value===''&&k==='deadline'?null:+e.target.value)}/></td>)}<td><input value={t.deps.join(',')} onChange={e=>set(i,'deps',e.target.value.split(',').map(s=>s.trim()).filter(Boolean))}/></td><td><button className="btn" onClick={()=>setP(p=>({...p,tasks:p.tasks.filter((_,x)=>x!==i)}))}>×</button></td></tr>)}</tbody></table></div></div>
<div style={{marginTop:12}}><button className="btn ghost" onClick={()=>setShowAdvanced(!showAdvanced)}>{showAdvanced?'Hide':'Show'} schema notes</button>{showAdvanced&&<div className="surface" style={{marginTop:9}}><p className="muted" style={{margin:0,fontSize:12}}>Task length is MI; CPU/RAM/storage/bandwidth are resource requirements. Dependencies are task IDs. The decoder uses random-key ordering only among ready tasks, so generated schedules respect precedence.</p></div>}</div>
</>}

function Resources({P,setP}){const ks=['cpu','mem','storage','bw','mips','cost','p_idle','p_max'];const L={cpu:'vCPU',mem:'RAM GB',storage:'Disk GB',bw:'BW Mbps',mips:'MIPS',cost:'$/h',p_idle:'Idle W',p_max:'Peak W'};const set=(i,k,v)=>setP(p=>({...p,vms:p.vms.map((x,j)=>j===i?{...x,[k]:v}:x)}));const mx=Math.max(...P.vms.map(v=>v.mips),1);
 return <><div className="section-head"><div><div className="eyebrow">Step 02</div><h1>Cloud resources</h1><p>Heterogeneous resources used by the real decoder and objective functions.</p></div><button className="btn" onClick={()=>setP(p=>({...p,vms:[...p.vms,{...p.vms[p.vms.length-1],id:'VM'+p.vms.length}]}))}>+ VM</button></div>
<div className="grid cols2">{P.vms.map((v,i)=><div className="surface" key={i}><div className="toolbar"><input style={{maxWidth:180,fontWeight:600}} value={v.id} onChange={e=>set(i,'id',e.target.value)}/><span className="grow"/><button className="btn" onClick={()=>setP(p=>({...p,vms:p.vms.filter((_,j)=>j!==i)}))}>Remove</button></div><div style={{margin:'13px 0 10px'}}><div className="label"><span>Relative compute capacity</span><b>{v.mips} MIPS</b></div><div className="bar"><i style={{width:(100*v.mips/mx)+'%'}}/></div></div><div className="grid cols4">{ks.map(k=><label className="label" style={{display:'block'}} key={k}>{L[k]}<input type="number" value={v[k]} onChange={e=>set(i,k,+e.target.value)}/></label>)}</div></div>)}</div></>}

function ObjectivePicker({P,setP}){const pr=P.params;const tog=k=>setP(p=>({...p,params:{...p.params,objectives:pr.objectives.includes(k)?pr.objectives.filter(x=>x!==k):[...pr.objectives,k]}}));return <div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>Objectives</h2><p>Select the trade-offs NSGA-II minimizes (utilization is internally transformed to 1 − U).</p></div><span className="pill">{pr.objectives.length} active</span></div><div className="grid cols3">{Object.keys(OBJ).map(k=><button key={k} className={'step '+(pr.objectives.includes(k)?'active':'')} onClick={()=>tog(k)}><span><b>{OBJ[k][0]}</b><br/><small>{k==='utilization'?'maximize':'minimize'}</small></span></button>)}</div><details><summary>Recommendation weights</summary><p className="muted" style={{fontSize:12}}>Weights are only used after optimization to recommend a Pareto point. They do not change NSGA-II selection.</p><div className="grid cols3">{Object.keys(OBJ).map(k=><label className="label" key={k}>{OBJ[k][0]}<input type="number" min="0" max="5" step=".5" value={pr.weights[k]??1} onChange={e=>setP(p=>({...p,params:{...p.params,weights:{...p.params.weights,[k]:+e.target.value}}}))}/></label>)}</div></details></div>}

function OptimizeSettings({P,setP}){const p=P.params;const set=(k,v)=>setP(x=>({...x,params:{...x.params,[k]:v}}));const tips={pop:'Candidate schedules per generation.',generations:'Maximum evolutionary cycles.',pc:'Probability of uniform crossover.',pm:'Per-gene mutation probability; blank means 1 / number of tasks.',seed:'Reproducibility seed.',patience:'Stop after this many unchanged ideal points; 0 disables early stopping.'};return <div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>Optimization controls</h2><p>Advanced parameters remain collapsed until you need them.</p></div></div><div className="grid cols3">{[['pop','Population'],['generations','Generations'],['pc','Crossover rate'],['pm','Mutation rate'],['seed','Seed'],['patience','Early-stop patience']].map(([k,l])=><label className="label" title={tips[k]} key={k}>{l}<input type="number" step="any" value={p[k]??''} onChange={e=>set(k,e.target.value===''&&k==='pm'?null:+e.target.value)}/></label>)}</div></div>}

function Spark({live,metric}){if(!live.length)return null;const W=760,H=150,L=42,R=12,T=12,B=28;const a=live.map(x=>x.best[metric]).filter(v=>v!=null);const lo=Math.min(...a),hi=Math.max(...a);const pts=a.map((v,i)=>`${L+i*(W-L-R)/Math.max(a.length-1,1)},${T+(hi>lo?(v-lo)/(hi-lo):.5)*(H-T-B)}`).join(' ');return <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="160"><line className="axis" x1={L} y1={T} x2={L} y2={H-B}/><line className="axis" x1={L} y1={H-B} x2={W-R} y2={H-B}/><polyline points={pts} fill="none" stroke="var(--accent)" strokeWidth="2.5"/><text className="chart-label" x={L} y={H-7}>1</text><text className="chart-label" x={W-R-25} y={H-7}>{live.length}</text><text className="chart-label" x={L+5} y={T+12}>{fmt(metric,lo)}</text><text className="chart-label" x={L+5} y={H-B-4}>{fmt(metric,hi)}</text><text className="chart-title" x={L+8} y={13}>{OBJ[metric][0]} · best over generation</text></svg>}

function ParetoScatter({points,selected,setSelected,objectives=['makespan','cost']}){const X=objectives[0],Y=objectives[1]||objectives[0];if(!points?.length)return <div className="muted">Pareto points will appear after the first completed generation.</div>;const W=760,H=330,L=55,R=20,T=18,B=45;const xs=points.map(p=>p.metrics[X]),ys=points.map(p=>p.metrics[Y]);const [x0,x1]=[Math.min(...xs),Math.max(...xs)], [y0,y1]=[Math.min(...ys),Math.max(...ys)];const px=v=>L+(x1>x0?(v-x0)/(x1-x0):.5)*(W-L-R),py=v=>H-B-(y1>y0?(v-y0)/(y1-y0):.5)*(H-T-B);return <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="330"><line className="axis" x1={L} y1={T} x2={L} y2={H-B}/><line className="axis" x1={L} y1={H-B} x2={W-R} y2={H-B}/><text className="chart-label" x={W/2-30} y={H-9}>{OBJ[X][0]}</text><text className="chart-label" x="6" y="15">↑ {OBJ[Y][0]}</text>{points.map((p,i)=><circle key={i} cx={px(p.metrics[X])} cy={py(p.metrics[Y])} r={selected===p.index?7:4.5} fill={selected===p.index?'var(--warn)':'var(--accent2)'} opacity=".88" onClick={()=>setSelected?.(p.index)} style={{cursor:'pointer'}}><title>#{p.index} · {OBJ[X][0]} {fmt(X,p.metrics[X])} · {OBJ[Y][0]} {fmt(Y,p.metrics[Y])}</title></circle>)}</svg>}

function PopulationView({population}){if(!population?.length)return <div className="muted">Population snapshot is waiting for the backend.</div>;return <div className="grid" style={{maxHeight:300,overflow:'auto'}}>{population.map((p,i)=><div className="chromosome" key={i}><span className="mono" style={{fontSize:10,width:28}}>#{i+1}</span><div className="genes">{p.assign.map((v,j)=><span className={'gene '+(p.rank===0?'hot':'')} data-v={v+1} key={j} title={`Task ${j+1} → VM gene ${v+1}`}/>)}</div><span className="state">{p.rank===0?'NON-DOM':`RANK ${p.rank}`} · {p.feasible?'feasible':'repaired'}</span></div>)}</div>}

function OperationDemo({events}){const sel=events.find(e=>e.phase==='parent_selection');const cross=events.find(e=>e.phase==='crossover');const mut=events.find(e=>e.phase==='mutation');const rep=events.find(e=>e.phase==='repair');if(!sel)return <div className="muted">Operator trace appears with each generation.</div>;const rows=[['Selection',sel?.parentA,sel?.parentB],['Crossover',cross?.parentA,cross?.child],['Mutation',mut?.original,mut?.mutated],['Repair',mut?.mutated,rep?.repaired]];return <div className="grid">{rows.map(([l,a,b])=><div key={l} className="chromosome"><b style={{width:70}}>{l}</b><div className="genes">{(a||[]).slice(0,22).map((v,i)=><span className="gene muted" data-v={v+1} key={i}/>)}</div><span>→</span><div className="genes">{(b||[]).slice(0,22).map((v,i)=><span className="gene hot" data-v={v+1} key={i}/>)}</div></div>)}</div>}

function OptimizePage({P,setP,job,setJob,onComplete}){const [events,setEvents]=useState([]);const [live,setLive]=useState([]);const [phase,setPhase]=useState('');const [error,setError]=useState('');const running=job?.status==='running';const current=live[live.length-1];const currentGen=current?.gen||0;
 const run=async()=>{setError('');setEvents([]);setLive([]);setPhase('');setJob(null);try{if(P.params.objectives.length<2)throw new Error('Choose at least two objectives.');const {id}=await post('/optimize',{...P,params:{...P.params,pm:P.params.pm||null}});setJob({id,status:'running'});const es=new EventSource(`/api/optimization/${id}/stream`);es.onmessage=e=>{const ev=JSON.parse(e.data);setEvents(x=>[...x,ev]);setPhase(ev.phase);if(ev.phase==='generation_complete')setLive(x=>[...x,ev])};es.addEventListener('end',async e=>{es.close();if(e.data!=='done'){setError('Backend optimization failed.');setJob({id,status:'failed'});return}const data=await api(`/optimization/${id}/results`);setJob({id,status:'done'});onComplete(id,data);});es.onerror=()=>{} }catch(e){setError(e.message)}};
 const opEvents=events.filter(e=>e.generation===currentGen);
 return <><div className="section-head"><div><div className="eyebrow">Step 03 · live backend trace</div><h1>{running?'NSGA-II is evolving the population.':'Optimization workspace'}</h1><p>{running?'Every update below is emitted by the Python engine as it executes.':'Set the objectives, then enter the live optimization workspace.'}</p></div>{!running&&<button className="btn primary" onClick={run} disabled={!P.tasks.length||!P.vms.length}>Start Optimization →</button>}</div>
 {!running&&job?.status==='done'?<div className="surface"><div className="signal"><span className="dot"/>Optimization complete · {live.length} generations observed</div><p className="muted">Open Results or Pareto Explorer to inspect the actual solutions.</p></div>:null}
 <div className="grid cols2"><div><ObjectivePicker P={P} setP={setP}/><div style={{height:14}}/><OptimizeSettings P={P} setP={setP}/></div>
 <div className="surface" style={{minHeight:360}}><div className="toolbar"><div><div className="eyebrow">Optimization engine</div><h2>Population evolution</h2></div><span className="grow"/><span className="pill">{currentGen}/{P.params.generations}</span></div>
 <div className="phase">{phases.map((x,i)=><div key={x} className={phase===x?'live':opEvents.some(e=>e.phase===x)?'done':''}>{phaseLabel[x]}</div>)}</div>
 {current&&<div className="kpis" style={{gridTemplateColumns:'repeat(3,1fr)'}}><div className="kpi"><strong>{current.population_size}</strong><span>Population</span></div><div className="kpi"><strong>{current.feasible_solutions}</strong><span>Feasible</span></div><div className="kpi"><strong>{current.front_size}</strong><span>Pareto front</span></div><div className="kpi"><strong>{fmt('makespan',current.best.makespan)}</strong><span>Best makespan</span></div><div className="kpi"><strong>{fmt('cost',current.best.cost)}</strong><span>Best cost</span></div><div className="kpi"><strong>{fmt('energy',current.best.energy)}</strong><span>Best energy</span></div><div className="kpi"><strong>{current.avg_fitness.toFixed(3)}</strong><span>Average fitness</span></div></div>}
 <div style={{marginTop:13}}><Spark live={live} metric="makespan"/></div>
 {error&&<div className="alert">{error}</div>}</div></div>
 {running||live.length?<div style={{marginTop:18}} className="grid cols2"><div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>Population snapshot</h2><p>Representative chromosomes; metrics remain computed over the complete population.</p></div><span className="pill">real snapshot</span></div><PopulationView population={current?.population||events.find(e=>e.phase==='next_generation'&&e.generation===currentGen)?.population}/></div>
 <div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>Pareto convergence</h2><p>Actual non-dominated points emitted by the current generation.</p></div></div><ParetoScatter points={events.filter(e=>e.phase==='pareto_front'&&e.generation===currentGen)[0]?.pareto||[]} /></div></div>:null}
 {running&&<div className="surface" style={{marginTop:14}}><div className="section-head" style={{marginTop:0}}><div><h2>Genetic operator trace</h2><p>The first selected pair in each generation is shown as an educational trace of the actual operator inputs/outputs.</p></div></div><OperationDemo events={opEvents}/></div>}
 </>}

function Utilization({S}){const vals=S.vms.map(v=>{const busy=S.tasks.filter(t=>t.vm===v.id).reduce((a,t)=>a+t.exec,0);return {...v,busy,util:S.metrics.makespan?busy/S.metrics.makespan:0}});return <div className="grid">{vals.map(v=><div className="vmrow" key={v.id}><div className="toolbar"><b>{v.id}</b><span className="grow"/><span className={v.util>.9?'bad':v.util>.7?'good':'muted'}>{(v.util*100).toFixed(1)}%</span></div><div className="bar" style={{marginTop:7}}><i style={{width:clamp(v.util)*100+'%'}}/></div><div className="muted" style={{fontSize:10,marginTop:4}}>{v.busy.toFixed(2)} s busy · {v.mips} MIPS</div></div>)}</div>}

function BarChart({items,unit='',max}){const mx=max||Math.max(...items.map(x=>x.value),1);return <div className="grid">{items.map(x=><div key={x.label}><div className="label"><span>{x.label}</span><b>{typeof x.value==='number'?x.value.toFixed(x.value<1?3:2):x.value}{unit}</b></div><div className="bar"><i style={{width:clamp(x.value/mx)*100+'%'}}/></div></div>)}</div>}

function Gantt({S,selected,setSelected,zoom,setZoom}){const [hover,setHover]=useState(null);const max=Math.max(...S.tasks.map(t=>t.end),1);const L=95,R=20,W=980*zoom,H=S.vms.length*38+48;const x=t=>L+t/max*(W-L-R);return <div><div className="toolbar" style={{marginBottom:8}}><span className="gantt-tip">Hover or click a task. Timeline is derived from the generated schedule.</span><span className="grow"/><button className="btn" onClick={()=>setZoom(z=>Math.max(.6,z-.2))}>−</button><span className="pill">{zoom.toFixed(1)}×</span><button className="btn" onClick={()=>setZoom(z=>Math.min(2,z+.2))}>+</button></div><div className="chart-wrap"><svg viewBox={`0 0 ${W} ${H}`} width={W} height={H}>{S.vms.map((v,i)=><g key={v.id}><text className="chart-label" x="4" y={i*38+23}>{v.id}</text><line className="gridline" x1={L} x2={W-R} y1={i*38+36} y2={i*38+36}/>{S.tasks.filter(t=>t.vm===v.id).map(t=><g key={t.id} onMouseEnter={()=>setHover(t)} onMouseLeave={()=>setHover(null)} onClick={()=>setSelected(t)} style={{cursor:'pointer'}}><rect x={x(t)} y={i*38+8} width={Math.max(3,t.exec/max*(W-L-R))} height="21" rx="4" fill={t.status==='missed'?'var(--danger)':'var(--accent)'} opacity={selected?.id===t.id?1:.78} stroke={selected?.id===t.id?'#fff':'none'}/><text x={x(t)+4} y={i*38+22} style={{fill:'#fff',fontSize:9}}>{t.id}</text></g>)}</g>)}{[0,.25,.5,.75,1].map(f=><text className="chart-label" key={f} x={L+f*(W-L-R)} y={H-7}>{(f*max).toFixed(0)}s</text>)}</svg></div>{hover&&<div className="pill">Task {hover.id} · {hover.start.toFixed(2)}–{hover.end.toFixed(2)}s · {hover.vm} · {hover.status}</div>}</div>}

function ResultSummary({cmp}){if(!cmp)return null;const keys=[['makespan','Makespan'],['cost','Cost'],['energy','Energy'],['utilization','Utilization']];return <div className="result-hero"><div className="big-result"><div className="eyebrow">Optimization complete</div><h2>NSGA-II found a measurable trade-off.</h2><p className="muted">Changes below compare the selected Pareto schedule against the actual Min-Min baseline.</p><div className="delta">{keys.map(([k,l])=>{const x=cmp.improvement_pct[k];return <div key={k}><strong className={x>=0?'good':'bad'}>{x>=0?'↓':'↑'} {Math.abs(x).toFixed(1)}%</strong><span>{l}</span></div>})}</div></div><div className="surface"><h2>Selected solution</h2><div className="grid cols2">{keys.map(([k,l])=><div className="kpi" key={k}><strong>{fmt(k,cmp.ga[k])}</strong><span>{l}</span></div>)}</div></div></div>}

function Results({jobId,results,sol,setSol}){const [S,setS]=useState(null);const [selected,setSelected]=useState(null);const [zoom,setZoom]=useState(1);const [metric,setMetric]=useState('makespan');const [cmp,setCmp]=useState(null);useEffect(()=>{if(!jobId)return;api(`/optimization/${jobId}/schedule?solution=${sol}`).then(x=>{setS(x);setSelected(null);setZoom(1)});post('/compare',{id:jobId,solution:sol}).then(setCmp)},[jobId,sol]);if(!results)return <div className="surface"><h2>No optimization result yet</h2><p className="muted">Run NSGA-II first.</p></div>;const p=results.pareto;const tasksPer=S?S.vms.map(v=>({label:v.id,value:S.tasks.filter(t=>t.vm===v.id).length})):[];const trade=p.solutions.find(x=>x.index===sol)?.metrics;const used=S?S.vms.map(v=>{const b=S.tasks.filter(t=>t.vm===v.id).reduce((a,t)=>a+t.exec,0);return {label:v.id,value:S.metrics.makespan?b/S.metrics.makespan:0}}):[];
 return <><div className="section-head"><div><div className="eyebrow">Step 04</div><h1>Results</h1><p>One selected schedule, with the evidence underneath.</p></div><select style={{width:250}} value={sol} onChange={e=>setSol(+e.target.value)}>{p.solutions.map(s=><option key={s.index} value={s.index}>Solution #{s.index}{s.index===p.recommended?' · recommended':''}</option>)}</select></div>
<ResultSummary cmp={cmp}/>
<div className="surface" style={{marginTop:14}}><div className="section-head" style={{marginTop:0}}><div><h2>Generation convergence</h2><p>Best objective value reported by the actual NSGA-II population at each generation.</p></div><select style={{width:180}} value={metric} onChange={e=>setMetric(e.target.value)}>{['makespan','cost','energy'].map(k=><option key={k} value={k}>{OBJ[k][0]}</option>)}</select></div><Spark live={results.history} metric={metric}/></div>
<div className="section-head"><div><h2>Generated schedule</h2><p>Gantt blocks come directly from the backend decoder.</p></div></div>
{S&&<div className="surface"><Gantt S={S} selected={selected} setSelected={setSelected} zoom={zoom} setZoom={setZoom}/>{selected&&<div className="grid cols4" style={{marginTop:12}}>{[['Task',selected.id],['VM',selected.vm],['Start',selected.start.toFixed(2)+' s'],['End',selected.end.toFixed(2)+' s'],['Execution',selected.exec.toFixed(2)+' s'],['Cost','$'+selected.cost.toFixed(5)],['Deadline',selected.deadline??'—'],['Status',selected.status]].map(x=><div className="kpi" key={x[0]}><strong style={{fontSize:13}}>{x[1]}</strong><span>{x[0]}</span></div>)}</div>}</div>}
<div className="grid cols2" style={{marginTop:14}}><div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>VM utilization</h2><p>Busy time divided by the schedule makespan.</p></div></div>{S&&<Utilization S={S}/>}</div><div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>Task distribution</h2><p>Actual assignment count by VM.</p></div></div><BarChart items={tasksPer}/></div></div>
<div className="section-head"><div><h2>Baseline evidence</h2><p>Actual Min-Min vs the selected Pareto schedule.</p></div></div>
<div className="grid cols3">{[['makespan','Makespan'],['cost','Cost'],['energy','Energy']].map(([k,l])=><div className="surface" key={k}><h3>{l}</h3>{cmp&&<><div className="label"><span>Min-Min</span><b>{fmt(k,cmp.baseline[k])}</b></div><div className="bar"><i style={{width:100*cmp.baseline[k]/Math.max(cmp.baseline[k],cmp.ga[k],1)+'%'}}/></div><div className="label" style={{marginTop:9}}><span>NSGA-II</span><b>{fmt(k,cmp.ga[k])}</b></div><div className="bar"><i style={{width:100*cmp.ga[k]/Math.max(cmp.baseline[k],cmp.ga[k],1)+'%'}}/></div><p className={cmp.improvement_pct[k]>=0?'good':'bad'} style={{fontSize:12}}>{cmp.improvement_pct[k]>=0?'Improved':'Trade-off'} · {Math.abs(cmp.improvement_pct[k]).toFixed(1)}%</p></>}</div>)}</div>
<div className="section-head"><div><h2>Objective trade-off</h2><p>Selected Pareto point across the objectives returned by the engine.</p></div></div>
{trade&&<div className="surface"><div className="toolbar"><select style={{width:180}} value={metric} onChange={e=>setMetric(e.target.value)}>{p.objectives.map(o=><option key={o} value={o}>{OBJ[o][0]}</option>)}</select><span className="muted">Click another solution above to update this analysis.</span></div><div className="grid cols4" style={{marginTop:13}}>{['makespan','cost','energy','utilization'].map(k=><div className="kpi" key={k}><strong>{fmt(k,trade[k])}</strong><span>{OBJ[k][0]}</span></div>)}</div></div>}
<div className="section-head"><div><h2>Export</h2></div></div>
<div className="toolbar">{S&&<><button className="btn" onClick={()=>dl('schedule.csv','id,vm,start,end,exec,wait,cost,energy_Wh,deadline,status\\n'+S.tasks.map(t=>[t.id,t.vm,t.start,t.end,t.exec,t.wait,t.cost,t.energy,t.deadline,t.status].join(',')).join('\\n'))}>Export CSV</button><button className="btn" onClick={()=>dl('schedule.json',JSON.stringify(S,null,2))}>Export JSON</button></>}</div>
</>}

function ParetoPage({jobId,results,sol,setSol}){const [selected,setSelected]=useState(sol);const [metric,setMetric]=useState('energy');if(!results)return <div className="surface"><h2>Run an optimization first.</h2></div>;const p=results.pareto;const current=p.solutions.find(x=>x.index===selected)||p.solutions[0];const xs=p.solutions.map(s=>s.metrics.makespan);const ys=p.solutions.map(s=>s.metrics.cost);const zs=p.solutions.map(s=>s.metrics.energy);const z0=Math.min(...zs),z1=Math.max(...zs);
 return <><div className="section-head"><div><div className="eyebrow">Step 05</div><h1>Pareto explorer</h1><p>{p.solutions.length} non-dominated schedules. Selecting one changes the Results schedule.</p></div><span className="pill">recommended #{p.recommended}</span></div>
<div className="grid cols2"><div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>Makespan × cost</h2><p>Each point is a real final NSGA-II solution.</p></div></div><ParetoScatter points={p.solutions} selected={selected} setSelected={x=>{setSelected(x);setSol(x)}} objectives={['makespan','cost']}/><div className="legend"><span><i style={{background:'var(--accent2)'}}/>Pareto solution</span><span><i style={{background:'var(--warn)'}}/>selected</span></div></div>
<div className="surface"><div className="section-head" style={{marginTop:0}}><div><h2>Objective profile</h2><p>Raw values for the selected point.</p></div></div>{current&&<><div className="grid">{['makespan','cost','energy','utilization'].map(k=>{const vals=p.solutions.map(s=>s.metrics[k]);const lo=Math.min(...vals),hi=Math.max(...vals);const q=hi>lo?(current.metrics[k]-lo)/(hi-lo):0;return <div key={k}><div className="label"><span>{OBJ[k][0]}</span><b>{fmt(k,current.metrics[k])}</b></div><div className="bar"><i style={{width:(k==='utilization'?(1-q):q)*100+'%'}}/></div></div>})}</div><div className="callout" style={{marginTop:15}}>The bar is a relative position within the actual Pareto set; it is not a normalized fitness score.</div></>}</div></div>
<div className="section-head"><div><h2>Solutions</h2><p>Click any row to load its schedule.</p></div></div>
<div className="surface scroll"><table><thead><tr><th>#</th>{['makespan','cost','energy','utilization','imbalance','deadline_misses'].map(k=><th key={k}>{OBJ[k]?.[0]||k}</th>)}</tr></thead><tbody>{p.solutions.map(s=><tr key={s.index} onClick={()=>{setSelected(s.index);setSol(s.index)}} style={{cursor:'pointer',background:selected===s.index?'#69a3ff12':'transparent'}}><td>{s.index}{s.index===p.recommended?' ★':''}</td>{['makespan','cost','energy','utilization','imbalance','deadline_misses'].map(k=><td key={k} className="compare-value">{fmt(k,s.metrics[k])}</td>)}</tr>)}</tbody></table></div></>}

function App(){const [page,setPage]=useState('workload');const [theme,setTheme]=useState('dark');const [P,setP]=useState({tasks:[],vms:[],params:{pop:60,generations:80,pc:.9,pm:null,seed:1,patience:0,objectives:['makespan','cost','energy'],weights:{}}});const [job,setJob]=useState(null);const [results,setResults]=useState(null);const [sol,setSol]=useState(0);const completed={workload:P.tasks.length>0,resources:P.vms.length>0,optimize:job?.status==='done',results:!!results,pareto:!!results};
 useEffect(()=>{document.documentElement.dataset.theme=theme},[theme]);useEffect(()=>{api('/sample?n=30&m=5&seed=1').then(d=>setP(p=>({...p,tasks:d.tasks,vms:d.vms})))},[]);
 const finish=(id,data)=>{setJob({id,status:'done'});setResults(data);setSol(data.pareto.recommended);setPage('results')};
 return <><Header page={page} setPage={setPage} theme={theme} setTheme={setTheme}/><main className="shell">{page==='overview'&&<Intro go={setPage} P={P}/>} {page!=='overview'&&<StepBar page={page} setPage={setPage} completed={completed}/>}
 {page==='workload'&&<Workload P={P} setP={setP}/>}
 {page==='resources'&&<Resources P={P} setP={setP}/>}
 {page==='optimize'&&<OptimizePage P={P} setP={setP} job={job} setJob={setJob} onComplete={finish}/>}
 {page==='results'&&<Results jobId={job?.id} results={results} sol={sol} setSol={setSol}/>}
 {page==='pareto'&&<ParetoPage jobId={job?.id} results={results} sol={sol} setSol={setSol}/>}
 {page==='workload'&&<div style={{marginTop:14}} className="toolbar"><span className="muted">Next: configure cloud resources.</span><span className="grow"/><button className="btn primary" onClick={()=>setPage('resources')}>Continue →</button></div>}
 {page==='resources'&&<div style={{marginTop:14}} className="toolbar"><span className="muted">Next: choose objectives and run NSGA-II.</span><span className="grow"/><button className="btn primary" onClick={()=>setPage('optimize')}>Continue →</button></div>}
 {page==='results'&&results&&<div style={{marginTop:18}} className="toolbar"><span className="muted">Explore the full non-dominated set.</span><span className="grow"/><button className="btn primary" onClick={()=>setPage('pareto')}>Open Pareto Explorer →</button></div>}
 </main></>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
